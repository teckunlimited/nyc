name: Deploy to Azure

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

env:
  ACR_NAME: nycacrtakkd33nvzu2k
  ACR_LOGIN_SERVER: nycacrtakkd33nvzu2k.azurecr.io
  ACR_RESOURCE_GROUP: nyc-shared-rg
  LOCATION: westus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment configuration
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "suffix=prod" >> $GITHUB_OUTPUT
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "resource_group=nyc-prod-rg" >> $GITHUB_OUTPUT
            echo "container_env=nyc-prod-env" >> $GITHUB_OUTPUT
            echo "backend_app=nyc-prod-backend" >> $GITHUB_OUTPUT
            echo "frontend_app=nyc-prod-frontend" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "suffix=staging" >> $GITHUB_OUTPUT
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "resource_group=nyc-staging-rg" >> $GITHUB_OUTPUT
            echo "container_env=nyc-staging-env" >> $GITHUB_OUTPUT
            echo "backend_app=nyc-staging-backend" >> $GITHUB_OUTPUT
            echo "frontend_app=nyc-staging-frontend" >> $GITHUB_OUTPUT
          else
            echo "suffix=dev" >> $GITHUB_OUTPUT
            echo "env_name=development" >> $GITHUB_OUTPUT
            echo "resource_group=nyc-dev-rg" >> $GITHUB_OUTPUT
            echo "container_env=nyc-dev-env" >> $GITHUB_OUTPUT
            echo "backend_app=nyc-dev-backend" >> $GITHUB_OUTPUT
            echo "frontend_app=nyc-dev-frontend" >> $GITHUB_OUTPUT
          fi

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register required resource providers
        run: |
          echo "Registering Azure resource providers..."
          az provider register --namespace Microsoft.KeyVault --wait
          az provider register --namespace Microsoft.DBforPostgreSQL --wait
          echo "Resource providers registered"

      - name: Ensure shared ACR resource group exists
        run: |
          az group create --name ${{ env.ACR_RESOURCE_GROUP }} --location ${{ env.LOCATION }} || true

      - name: Create resource group if not exists
        run: |
          az group create --name ${{ steps.env.outputs.resource_group }} --location ${{ env.LOCATION }} || true

      - name: Create Container Apps environment if not exists
        run: |
          if ! az containerapp env show --name ${{ steps.env.outputs.container_env }} --resource-group ${{ steps.env.outputs.resource_group }} 2>/dev/null; then
            echo "Creating Container Apps environment..."
            
            az monitor log-analytics workspace create \
              --resource-group ${{ steps.env.outputs.resource_group }} \
              --workspace-name ${{ steps.env.outputs.container_env }}-logs \
              --location ${{ env.LOCATION }} 2>/dev/null || true
            
            LOG_WORKSPACE_ID=$(az monitor log-analytics workspace show \
              --resource-group ${{ steps.env.outputs.resource_group }} \
              --workspace-name ${{ steps.env.outputs.container_env }}-logs \
              --query customerId --output tsv)
            
            LOG_WORKSPACE_KEY=$(az monitor log-analytics workspace get-shared-keys \
              --resource-group ${{ steps.env.outputs.resource_group }} \
              --workspace-name ${{ steps.env.outputs.container_env }}-logs \
              --query primarySharedKey --output tsv)
            
            az containerapp env create \
              --name ${{ steps.env.outputs.container_env }} \
              --resource-group ${{ steps.env.outputs.resource_group }} \
              --location ${{ env.LOCATION }} \
              --logs-workspace-id $LOG_WORKSPACE_ID \
              --logs-workspace-key $LOG_WORKSPACE_KEY
          fi

      - name: Create Key Vault and Database Password
        id: keyvault
        run: |
          # Generate unique but deterministic Key Vault name based on resource group
          KEYVAULT_NAME="nyc-${{ steps.env.outputs.suffix }}-kv$(echo ${{ steps.env.outputs.resource_group }} | md5sum | cut -c1-8)"
          
          echo "Creating/verifying Key Vault: $KEYVAULT_NAME"
          
          # Create Key Vault if it doesn't exist
          if ! az keyvault show --name $KEYVAULT_NAME --resource-group ${{ steps.env.outputs.resource_group }} &>/dev/null; then
            echo "Creating new Key Vault..."
            az keyvault create \
              --name $KEYVAULT_NAME \
              --resource-group ${{ steps.env.outputs.resource_group }} \
              --location ${{ env.LOCATION }} \
              --enable-rbac-authorization false \
              --enabled-for-deployment true \
              --enabled-for-template-deployment true
            
            echo "Waiting for Key Vault DNS to propagate..."
            sleep 30
          fi
          
          # Grant access to service principal (idempotent)
          az keyvault set-policy \
            --name $KEYVAULT_NAME \
            --resource-group ${{ steps.env.outputs.resource_group }} \
            --object-id f3098b92-9b40-4003-99fc-2be4e16f9506 \
            --secret-permissions get list set delete || true
          
          echo "name=$KEYVAULT_NAME" >> $GITHUB_OUTPUT
          
          # Check if password already exists, if not generate one
          if ! az keyvault secret show --vault-name $KEYVAULT_NAME --name db-password &>/dev/null; then
            echo "Generating new database password..."
            # Generate secure password (20 chars, alphanumeric only for compatibility)
            DB_PASSWORD=$(openssl rand -base64 30 | tr -dc 'a-zA-Z0-9' | head -c 20)
            
            # Store in Key Vault
            az keyvault secret set \
              --vault-name $KEYVAULT_NAME \
              --name db-password \
              --value "$DB_PASSWORD" \
              --output none
            
            echo "Password stored in Key Vault"
          else
            echo "Using existing password from Key Vault"
          fi
          
          # Get the password (never echo it)
          DB_PASSWORD=$(az keyvault secret show --vault-name $KEYVAULT_NAME --name db-password --query value -o tsv)
          echo "::add-mask::$DB_PASSWORD"
          echo "password=$DB_PASSWORD" >> $GITHUB_OUTPUT

      - name: Create PostgreSQL Database
        id: postgres
        run: |
          # Generate deterministic server name based on resource group
          DB_SERVER_NAME="nyc-${{ steps.env.outputs.suffix }}-db$(echo ${{ steps.env.outputs.resource_group }} | md5sum | cut -c1-6)"
          DB_ADMIN_USER="nycadmin"
          
          echo "PostgreSQL server name: $DB_SERVER_NAME"
          
          # Check if server already exists
          if ! az postgres flexible-server show --name $DB_SERVER_NAME --resource-group ${{ steps.env.outputs.resource_group }} 2>/dev/null; then
            echo "Creating PostgreSQL Flexible Server..."
            az postgres flexible-server create \
              --name $DB_SERVER_NAME \
              --resource-group ${{ steps.env.outputs.resource_group }} \
              --location ${{ env.LOCATION }} \
              --admin-user $DB_ADMIN_USER \
              --admin-password "${{ steps.keyvault.outputs.password }}" \
              --sku-name Standard_B1ms \
              --tier Burstable \
              --storage-size 32 \
              --version 16 \
              --public-access 0.0.0.0-255.255.255.255 \
              --yes
            
            echo "Waiting for server to be ready..."
            sleep 30
            
            # Create database
            echo "Creating database nycdb..."
            az postgres flexible-server db create \
              --resource-group ${{ steps.env.outputs.resource_group }} \
              --server-name $DB_SERVER_NAME \
              --database-name nycdb
          else
            echo "PostgreSQL server already exists"
          fi
          
          echo "server_name=$DB_SERVER_NAME" >> $GITHUB_OUTPUT
          echo "admin_user=$DB_ADMIN_USER" >> $GITHUB_OUTPUT
          
          # Build connection string (password will be masked in logs)
          DB_HOST="${DB_SERVER_NAME}.postgres.database.azure.com"
          CONNECTION_STRING="postgresql://${DB_ADMIN_USER}:${{ steps.keyvault.outputs.password }}@${DB_HOST}:5432/nycdb?sslmode=require"
          echo "::add-mask::$CONNECTION_STRING"
          echo "connection_string=$CONNECTION_STRING" >> $GITHUB_OUTPUT
          echo "Database configuration complete"

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }} --resource-group ${{ env.ACR_RESOURCE_GROUP }}

      - name: Get ACR credentials
        id: acr
        run: |
          ACR_USERNAME=$(az acr credential show --name ${{ env.ACR_NAME }} --resource-group ${{ env.ACR_RESOURCE_GROUP }} --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --resource-group ${{ env.ACR_RESOURCE_GROUP }} --query passwords[0].value -o tsv)
          echo "username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "::add-mask::$ACR_PASSWORD"
          echo "password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }} \
                       -t ${{ env.ACR_LOGIN_SERVER }}/backend:${{ steps.env.outputs.suffix }} \
                       -t ${{ env.ACR_LOGIN_SERVER }}/backend:latest \
                       ./backend
          docker push ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/backend:${{ steps.env.outputs.suffix }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/backend:latest

      - name: Build and push frontend image (placeholder)
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} \
                       -t ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ steps.env.outputs.suffix }} \
                       -t ${{ env.ACR_LOGIN_SERVER }}/frontend:latest \
                       ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ steps.env.outputs.suffix }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:latest

      - name: Build and push data loader image
        run: |
          docker build --platform linux/amd64 \
                       -f ./backend/Dockerfile.dataloader \
                       -t ${{ env.ACR_LOGIN_SERVER }}/nyc-data-loader:${{ github.sha }} \
                       -t ${{ env.ACR_LOGIN_SERVER }}/nyc-data-loader:${{ steps.env.outputs.suffix }} \
                       -t ${{ env.ACR_LOGIN_SERVER }}/nyc-data-loader:latest \
                       ./backend
          docker push ${{ env.ACR_LOGIN_SERVER }}/nyc-data-loader:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/nyc-data-loader:${{ steps.env.outputs.suffix }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/nyc-data-loader:latest

      - name: Deploy backend to Azure Container Apps
        if: github.event_name == 'push'
        run: |
          # Mask the connection string in logs
          echo "::add-mask::${{ steps.postgres.outputs.connection_string }}"
          
          az containerapp update \
            --name ${{ steps.env.outputs.backend_app }} \
            --resource-group ${{ steps.env.outputs.resource_group }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }} \
            --set-env-vars DATABASE_URL="${{ steps.postgres.outputs.connection_string }}" ENVIRONMENT=${{ steps.env.outputs.env_name }} \
            2>/dev/null || az containerapp create \
              --name ${{ steps.env.outputs.backend_app }} \
              --resource-group ${{ steps.env.outputs.resource_group }} \
              --environment ${{ steps.env.outputs.container_env }} \
              --image ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }} \
              --target-port 8000 \
              --ingress external \
              --registry-server ${{ env.ACR_LOGIN_SERVER }} \
              --registry-username ${{ steps.acr.outputs.username }} \
              --registry-password ${{ steps.acr.outputs.password }} \
              --cpu 0.5 --memory 1.0Gi \
              --min-replicas 1 --max-replicas 3 \
              --env-vars DATABASE_URL="${{ steps.postgres.outputs.connection_string }}" ENVIRONMENT=${{ steps.env.outputs.env_name }}

      - name: Get backend URL and update frontend configuration
        if: github.event_name == 'push'
        id: backend
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name ${{ steps.env.outputs.backend_app }} \
            --resource-group ${{ steps.env.outputs.resource_group }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$BACKEND_FQDN" >> $GITHUB_OUTPUT
          echo "url=https://$BACKEND_FQDN" >> $GITHUB_OUTPUT
          
          echo "Updating frontend with backend URL: https://$BACKEND_FQDN"
          
          # Update nginx config with actual backend URL
          sed -i "s|BACKEND_URL_PLACEHOLDER|https://$BACKEND_FQDN|g" frontend/nginx.conf
          
          # Update Angular environment files with actual backend URL
          sed -i "s|apiUrl: '.*'|apiUrl: 'https://$BACKEND_FQDN'|g" frontend/src/environments/environment.ts
          sed -i "s|apiUrl: '.*'|apiUrl: 'https://$BACKEND_FQDN'|g" frontend/src/environments/environment.prod.ts
          
          # Rebuild frontend with correct backend URL
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}-final \
                       --build-arg BACKEND_URL=https://$BACKEND_FQDN \
                       ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}-final

      - name: Deploy frontend to Azure Container Apps
        if: github.event_name == 'push'
        run: |
          az containerapp update \
            --name ${{ steps.env.outputs.frontend_app }} \
            --resource-group ${{ steps.env.outputs.resource_group }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}-final \
            --set-env-vars BACKEND_URL=${{ steps.backend.outputs.url }} \
            2>/dev/null || az containerapp create \
              --name ${{ steps.env.outputs.frontend_app }} \
              --resource-group ${{ steps.env.outputs.resource_group }} \
              --environment ${{ steps.env.outputs.container_env }} \
              --image ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}-final \
              --target-port 80 \
              --ingress external \
              --registry-server ${{ env.ACR_LOGIN_SERVER }} \
              --registry-username ${{ steps.acr.outputs.username }} \
              --registry-password ${{ steps.acr.outputs.password }} \
              --cpu 0.5 --memory 1.0Gi \
              --min-replicas 1 --max-replicas 3 \
              --env-vars BACKEND_URL=${{ steps.backend.outputs.url }} ENVIRONMENT=${{ steps.env.outputs.env_name }}

      - name: Display deployment URLs
        if: github.event_name == 'push'
        run: |
          echo "### 🚀 Deployment Complete - ${{ steps.env.outputs.env_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          FRONTEND_URL=$(az containerapp show \
            --name ${{ steps.env.outputs.frontend_app }} \
            --resource-group ${{ steps.env.outputs.resource_group }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "**Environment:** ${{ steps.env.outputs.env_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** ${{ steps.env.outputs.resource_group }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend API:** ${{ steps.backend.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Health:** ${{ steps.backend.outputs.url }}/health" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Docs:** ${{ steps.backend.outputs.url }}/docs" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend App:** https://$FRONTEND_URL" >> $GITHUB_STEP_SUMMARY
